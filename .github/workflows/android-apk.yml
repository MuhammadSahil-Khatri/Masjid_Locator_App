
name: Android Production Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Choose what to build
        type: choice
        required: true
        default: apk
        options:
          - apk
          - aab

      version_code:
        description: Android version code (must be higher than latest Play release for AAB)
        type: string
        required: true
        default: '6'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate build inputs
        run: |
          if ! [[ "$BUILD_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Version code must be a positive integer."
            exit 1
          fi

          if [[ "$BUILD_TYPE" != "apk" && "$BUILD_TYPE" != "aab" ]]; then
            echo "Invalid build type."
            exit 1
          fi

          echo "Build type: $BUILD_TYPE"
          echo "Version code: $BUILD_VERSION_CODE"

      - name: Restore Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/jah-upload-key.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure release signing and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          version_code = os.environ["BUILD_VERSION_CODE"]

          debug_config = """    signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""

          release_config = """    signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }"""

          if debug_config not in content:
              raise SystemExit("Could not locate expected signingConfigs block")

          content = content.replace(debug_config, release_config, 1)

          build_types_start = content.index("    buildTypes {")
          release_start = content.index("        release {", build_types_start)
          signing_line = content.index(
              "signingConfig signingConfigs.debug",
              release_start
          )

          content = (
              content[:signing_line]
              + "signingConfig signingConfigs.release"
              + content[signing_line + len("signingConfig signingConfigs.debug"):]
          )

          content, count = re.subn(
              r"(?m)^(\s*versionCode\s+)\d+",
              lambda match: match.group(1) + version_code,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update versionCode")

          path.write_text(content)

          print(f"Release signing configured.")
          print(f"Version code set to {version_code}.")
          PY

      - name: Build production APK
        if: inputs.build_type == 'apk'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build production AAB
        if: inputs.build_type == 'aab'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        if: inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: jah-production-apk-v${{ inputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        if: inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: jah-production-aab-v${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
